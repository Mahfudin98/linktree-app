version: "3.9"

services:


  # ─── Backend (Hono.js) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linktree_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    # Port 3001 TIDAK di-expose — traffic masuk lewat Traefik/reverse proxy
    networks:
      - linktree_net
      - coolify
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (SvelteKit) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linktree_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # PUBLIC_ prefix makes it available in browser too (SvelteKit convention)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    # Hapus mapping port publik agar tidak bentrok, gunakan routing internal Traefik/Coolify
    # Tambahkan alias lokal agar SvelteKit SSR tidak timeout saat me-request API via domain publik
    extra_hosts:
      - "m6i06e9s6magrjou8hlqd4g2.lsskincare.cloud:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linktree_net
      - coolify

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  linktree_net:
    driver: bridge
  coolify:
    name: coolify
    external: true
