version: "3.9"

services:
  # ─── Backend (Hono.js) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3001:3001"
    extra_hosts:
      - "m6i06e9s6magrjou8hlqd4g2.lsskincare.cloud:host-gateway"
    networks:
      - linktree_net
      - coolify
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend (SvelteKit) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "3000:3000"
    extra_hosts:
      - "m6i06e9s6magrjou8hlqd4g2.lsskincare.cloud:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linktree_net
      - coolify

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  linktree_net:
    driver: bridge
  coolify:
    name: coolify
    external: true
